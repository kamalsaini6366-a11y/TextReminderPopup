
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packager
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone EXE
        run: python -m PyInstaller --onefile --windowed --name TextReminderPopup text_reminder_popup.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TextReminderPopup-Windows-EXE
          path: dist/TextReminderPopup.exe
          if-no-files-found: error

